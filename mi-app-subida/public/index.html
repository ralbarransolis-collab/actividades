<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto Talento - Subida de imágenes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-5" style="max-width: 900px;">

    <div class="card shadow-sm bg-dark mb-4">
        <div class="card-body">
            <h1 class="h3 text-light mb-1">Foto Talento — Subida de Imágenes</h1>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-7">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h4">Subir imagen</h2>
               
                    <form id="formUpload" action="/upload" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="foto" class="form-label">
                                Seleccione una imagen jpg, jpeg, png o gif
                            </label>
                            <input type="file" id="foto" name="foto" class="form-control" accept="image/*" required>
                        </div>

                        <button type="submit" class="btn btn-primary">Subir</button>
                    </form>

                    <div id="mensaje" class="mt-3"></div>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h4">Vista previa</h2>
                    <img id="preview" class="img-fluid rounded border d-none" alt="Vista previa">
                    <p id="sinPreview" class="text-secondary">Seleccione una imagen.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm mt-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h2 class="h4 mb-0">Galería</h2>
                </div>
                <button id="btnActualizar" class="btn btn-outline-primary btn-sm">
                    Actualizar
                </button>
            </div>

            <div id="galeria" class="row g-3"></div>
        </div>
    </div>

</div>

<script>
const form = document.getElementById("formUpload");
const foto = document.getElementById("foto");
const mensaje = document.getElementById("mensaje");
const preview = document.getElementById("preview");
const sinPreview = document.getElementById("sinPreview");
const galeria = document.getElementById("galeria");
const btnActualizar = document.getElementById("btnActualizar");

function mostrarMensaje(texto, tipo) {
    mensaje.innerHTML = `<div class="alert alert-${tipo} mb-0">${texto}</div>`;
}

foto.addEventListener("change", () => {
    const archivo = foto.files[0];

    if (!archivo) {
        preview.classList.add("d-none");
        sinPreview.classList.remove("d-none");
        return;
    }

    preview.src = URL.createObjectURL(archivo);
    preview.classList.remove("d-none");
    sinPreview.classList.add("d-none");
});

form.addEventListener("submit", async (evento) => {
    evento.preventDefault();

    try {
        const datos = new FormData(form);

        const respuesta = await fetch("/upload", {
            method: "POST",
            body: datos
        });

        const json = await respuesta.json();

        if (!respuesta.ok) {
            mostrarMensaje(json.mensaje, "danger");
            return;
        }

        mostrarMensaje(`${json.mensaje}: ${json.archivo}`, "success");
        form.reset();
        preview.classList.add("d-none");
        sinPreview.classList.remove("d-none");
        cargarGaleria();

    } catch (error) {
        mostrarMensaje("Error al conectar con el servidor", "danger");
    }
});

async function cargarGaleria() {
    try {
        const respuesta = await fetch("/galeria");
        const datos = await respuesta.json();

        if (!respuesta.ok) {
            galeria.innerHTML = `<p class="text-danger">${datos.mensaje}</p>`;
            return;
        }

        galeria.innerHTML = "";

        if (datos.data.length === 0) {
            galeria.innerHTML = `<p class="text-secondary">No hay imágenes subidas.</p>`;
            return;
        }

        datos.data.forEach(imagen => {
            galeria.innerHTML += `
                <div class="col-md-4">
                    <div class="card h-100">
                        <img src="${imagen.ruta}" class="card-img-top" style="height:180px;object-fit:cover;">
                        <div class="card-body">
                            <small>${imagen.nombre}</small>
                        </div>
                    </div>
                </div>
            `;
        });

    } catch (error) {
        galeria.innerHTML = `<p class="text-danger">Error al cargar la galería.</p>`;
    }
}

btnActualizar.addEventListener("click", cargarGaleria);

cargarGaleria();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
