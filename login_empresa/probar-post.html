<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Probar POST</title>
</head>
<body>

    //archivo temporal para probar los cambios en la API
    
    <h1>Crear empleado</h1>

    <form id="formulario">
        <input
            type="text"
            id="nombre"
            placeholder="Nombre"
            required
        >

        <input
            type="text"
            id="cargo"
            placeholder="Cargo"
            required
        >

        <input
            type="number"
            id="sueldo"
            placeholder="Sueldo"
            required
        >

        <button type="submit">
            Crear
        </button>
    </form>

    <pre id="resultado"></pre>

    <script>
        const formulario = document.getElementById('formulario');
        const resultado = document.getElementById('resultado');

        formulario.addEventListener('submit', async (evento) => {
            evento.preventDefault();

            const respuesta = await fetch(
                'http://localhost:3000/api/v1/empleados',
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nombre: document.getElementById('nombre').value,
                        cargo: document.getElementById('cargo').value,
                        sueldo: Number(
                            document.getElementById('sueldo').value
                        ),
                        total_asistencias: 0
                    })
                }
            );

            const datos = await respuesta.json();

            resultado.textContent = JSON.stringify(
                datos,
                null,
                2
            );
        });
    </script>

</body>
</html>
