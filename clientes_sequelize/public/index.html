<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Gestión de clientes DIFER</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <header class="bg-dark text-white shadow-sm">
        <div
            class="container py-3 d-flex justify-content-between align-items-center"
        >
            <div>
                <h1 class="h3 mb-0 fw-bold">
                    DIFER
                </h1>
                <p class="mb-0 small text-white-50">
                    DISTRIBUIDORA FERRETERA
                </p>
            </div>
            <div class="text-end">
                <span class="small">
                    Gestión de Clientes
                </span>
            </div>
        </div>
    </header>
    <main class="container mt-4 flex-grow-1">
        <h2>
            Gestión de clientes
        </h2>
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h4 class="mb-3">
                    Agregar cliente
                </h4>
                <form id="formCliente">
                    <div class="mb-3">
                        <label
                            for="nombre"
                            class="form-label"
                        >
                            Nombre
                        </label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            class="form-control"
                            required
                        >
                    </div>
                    <div class="mb-3">
                        <label
                            for="email"
                            class="form-label"
                        >
                            Email
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            required
                        >
                    </div>
                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Agregar cliente
                    </button>
                </form>
                <div
                    id="mensaje"
                    class="mt-3"
                >
                </div>
            </div>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <div
                    class="d-flex justify-content-between align-items-center mb-3"
                >
                    <h4 class="mb-0">
                        Clientes registrados
                    </h4>
                    <button
                        id="btnListar"
                        type="button"
                        class="btn btn-primary"
                    >
                        Obtener clientes
                    </button>
                </div>
                <div class="table-responsive">
                    <table
                        class="table table-striped table-bordered"
                    >
                        <thead class="table-dark">
                            <tr>

                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Email</th>
                            </tr>
                        </thead>
                        <tbody id="listaClientes">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">
            DIFER - Distribuidora Ferretera
        </p>
    </footer>
    <script>
        const API = "/clientes";
        const formulario =
            document.getElementById(
                "formCliente"
            );
        const btnListar =
            document.getElementById(
                "btnListar"
            );
        const listaClientes =
            document.getElementById(
                "listaClientes"
            );
        const mensaje =
            document.getElementById(
                "mensaje"
            );
        async function obtenerClientes() {
            try {
                const respuesta =
                    await fetch(API);
                const clientes =
                    await respuesta.json();
                listaClientes.innerHTML =
                    "";
                if (
                    clientes.length === 0
                ) {
                    listaClientes.innerHTML = `
                        <tr>
                            <td
                                colspan="3"
                                class="text-center"
                            >
                                No existen clientes registrados.
                            </td>
                        </tr>
                    `;
                    return;
                }
                clientes.forEach(
                    cliente => {
                        listaClientes.innerHTML += `
                            <tr>
                                <td>
                                    ${cliente.id}
                                </td>
                                <td>
                                    ${cliente.nombre}
                                </td>
                                <td>
                                    ${cliente.email}
                                </td>
                            </tr>
                        `;
                    }
                );
            } catch (error) {
                console.error(error);
                mensaje.innerHTML = `
                    <div class="alert alert-danger">
                        Error al obtener clientes.
                    </div>
                `;
            }
        }
        btnListar.addEventListener(
            "click",
            obtenerClientes
        );
        formulario.addEventListener(
            "submit",
            async (evento) => {
               evento.preventDefault();
                const nombre =
                    document.getElementById(
                        "nombre"
                    ).value.trim();
                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();
                const nuevoCliente = {
                    nombre,
                    email
                };
                try {
                    const respuesta =
                        await fetch(
                            API,
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },
                                body:
                                    JSON.stringify(
                                        nuevoCliente
                                    )
                            }
                        );
                    const datos =
                        await respuesta.json();

                    if (!respuesta.ok) {
                        mensaje.innerHTML = `
                            <div class="alert alert-danger">
                                ${datos.mensaje}
                            </div>
                        `;
                        return;
                    }

                    mensaje.innerHTML = `
                        <div class="alert alert-success">
                            ${datos.mensaje}
                        </div>
                    `;
                    formulario.reset();
                    obtenerClientes();
                } catch (error) {
                    console.error(error);
                    mensaje.innerHTML = `
                        <div class="alert alert-danger">
                            Error al agregar cliente.
                        </div>
                    `;
                }
            }
        );
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
</body>
</html>
