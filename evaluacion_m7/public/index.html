<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Países - Evaluación M7</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<header class="bg-dark text-white shadow-sm">
    <div class="container py-3">
        <h1 class="h3 mb-0">Administración de Países</h1>
    </div>
</header>

<main class="container py-4 flex-grow-1">

    <div id="mensaje"></div>

    <!-- LISTADO -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
                <div>
                    <h4 class="mb-2">Listado de países</h4>

                    <label for="cantidad" class="form-label">
                        Registros por página
                    </label>

                    <select id="cantidad" class="form-select">
                        <option value="5">5</option>
                        <option value="10">10</option>
                        <option value="20">20</option>
                    </select>
                </div>

                <div>
                    <button id="btnObtener" class="btn btn-primary">
                        Obtener países
                    </button>

                    <button id="btnAnterior" class="btn btn-outline-secondary" disabled>
                        Anterior
                    </button>

                    <button id="btnSiguiente" class="btn btn-outline-primary" disabled>
                        Siguiente
                    </button>
                </div>
            </div>

            <p id="paginaActual" class="text-secondary"></p>

            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>País</th>
                            <th>Continente</th>
                            <th>Población</th>
                            <th>PIB 2019</th>
                            <th>PIB 2020</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPaises"></tbody>
                </table>
            </div>

        </div>
    </div>

    <div class="row g-4">

        <!-- AGREGAR -->
        <div class="col-lg-7">
            <div class="card shadow-sm h-100">
                <div class="card-body">

                    <h4>Agregar país</h4>

                    <form id="formAgregar">

                        <div class="row g-3">

                            <div class="col-md-6">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input id="nombre" class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label for="continente" class="form-label">Continente</label>
                                <input id="continente" class="form-control" required>
                            </div>

                            <div class="col-md-4">
                                <label for="poblacion" class="form-label">Población</label>
                                <input id="poblacion" type="number" min="0" class="form-control" required>
                            </div>

                            <div class="col-md-4">
                                <label for="pib2019" class="form-label">PIB 2019</label>
                                <input id="pib2019" type="number" min="0" class="form-control" required>
                            </div>

                            <div class="col-md-4">
                                <label for="pib2020" class="form-label">PIB 2020</label>
                                <input id="pib2020" type="number" min="0" class="form-control" required>
                            </div>

                        </div>

                        <button class="btn btn-success mt-3">
                            Agregar país
                        </button>

                    </form>

                </div>
            </div>
        </div>

        <!-- ELIMINAR -->
        <div class="col-lg-5">
            <div class="card shadow-sm h-100">
                <div class="card-body">

                    <h4>Eliminar país</h4>

                    <form id="formEliminar">

                        <div class="mb-3">
                            <label for="nombreEliminar" class="form-label">
                                Nombre del país
                            </label>

                            <input
                                id="nombreEliminar"
                                class="form-control"
                                placeholder="Ej.: Chile"
                                required
                            >
                        </div>

                        <button class="btn btn-danger">
                            Eliminar país
                        </button>

                    </form>

                </div>
            </div>
        </div>

    </div>

</main>

<footer class="bg-dark text-white text-center py-3 mt-auto">
    <p class="mb-0">Sitio desarrollado por <kbd class="bg-primary">CHOCOLAT</kbd></p>
</footer>

<script>
const tablaPaises = document.getElementById("tablaPaises");
const cantidadSelect = document.getElementById("cantidad");
const btnObtener = document.getElementById("btnObtener");
const btnAnterior = document.getElementById("btnAnterior");
const btnSiguiente = document.getElementById("btnSiguiente");
const paginaActual = document.getElementById("paginaActual");
const mensaje = document.getElementById("mensaje");
const formAgregar = document.getElementById("formAgregar");
const formEliminar = document.getElementById("formEliminar");

let pagina = 1;

function mostrarMensaje(texto, tipo = "success") {
    mensaje.innerHTML = `
        <div class="alert alert-${tipo} alert-dismissible fade show">
            ${texto}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    `;
}

async function cargarPaises() {
    const cantidad = Number(cantidadSelect.value);

    try {
        const respuesta = await fetch(
            `/paises?cantidad=${cantidad}&pagina=${pagina}`
        );

        const datos = await respuesta.json();

        if (!respuesta.ok) {
            mostrarMensaje(datos.mensaje, "danger");
            return;
        }

        tablaPaises.innerHTML = "";

        if (datos.paises.length === 0) {
            tablaPaises.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center">
                        No hay registros para mostrar.
                    </td>
                </tr>
            `;
        }

        datos.paises.forEach(pais => {
            tablaPaises.innerHTML += `
                <tr>
                    <td>${pais.nombre}</td>
                    <td>${pais.continente ?? ""}</td>
                    <td>${Number(pais.poblacion).toLocaleString("es-CL")}</td>
                    <td>${Number(pais.pib_2019).toLocaleString("es-CL")}</td>
                    <td>${Number(pais.pib_2020).toLocaleString("es-CL")}</td>
                </tr>
            `;
        });

        paginaActual.textContent = `Página ${datos.pagina}`;
        btnAnterior.disabled = pagina <= 1;
        btnSiguiente.disabled = !datos.hayMas;

    } catch (error) {
        console.error(error);
        mostrarMensaje("Error al conectar con el servidor", "danger");
    }
}

btnObtener.addEventListener("click", () => {
    pagina = 1;
    cargarPaises();
});

cantidadSelect.addEventListener("change", () => {
    pagina = 1;
    cargarPaises();
});

btnSiguiente.addEventListener("click", () => {
    pagina++;
    cargarPaises();
});

btnAnterior.addEventListener("click", () => {
    if (pagina > 1) pagina--;
    cargarPaises();
});

formAgregar.addEventListener("submit", async evento => {
    evento.preventDefault();

    const body = {
        nombre: document.getElementById("nombre").value.trim(),
        continente: document.getElementById("continente").value.trim(),
        poblacion: Number(document.getElementById("poblacion").value),
        pib_2019: Number(document.getElementById("pib2019").value),
        pib_2020: Number(document.getElementById("pib2020").value)
    };

    try {
        const respuesta = await fetch("/paises", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {
            mostrarMensaje(datos.mensaje, "danger");
            return;
        }

        mostrarMensaje(datos.mensaje);
        formAgregar.reset();
        pagina = 1;
        cargarPaises();

    } catch (error) {
        console.error(error);
        mostrarMensaje("Error al agregar el país", "danger");
    }
});

formEliminar.addEventListener("submit", async evento => {
    evento.preventDefault();

    const nombre = document.getElementById("nombreEliminar").value.trim();

    try {
        const respuesta = await fetch(
            `/paises?nombre=${encodeURIComponent(nombre)}`,
            { method: "DELETE" }
        );

        const datos = await respuesta.json();

        if (!respuesta.ok) {
            mostrarMensaje(datos.mensaje, "danger");
            return;
        }

        mostrarMensaje(datos.mensaje);
        formEliminar.reset();
        pagina = 1;
        cargarPaises();

    } catch (error) {
        console.error(error);
        mostrarMensaje("Error al eliminar el país", "danger");
    }
});

cargarPaises();
</script>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
></script>

</body>
</html>
