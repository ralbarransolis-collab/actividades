<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Cine - Películas y Actores
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">
    <header class="bg-dark text-white shadow-sm">
        <div class="container py-3 d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h3 mb-0 fw-bold">
                    CINE N-N
                </h1>
                <p class="mb-0 small text-white-50">
                    Películas y Actores
                </p>
            </div>
        </div>
    </header>
    <main class="container py-4 flex-grow-1">
        <div id="mensaje"></div>
        <div class="row g-4 mb-4">
            <div class="col-lg-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h4>
                            Crear película
                        </h4>
                        <form id="formPelicula">
                            <div class="mb-3">
                                <label for="titulo" class="form-label">
                                    Título
                                </label>
                                <input type="text" id="titulo" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="anio" class="form-label">
                                    Año
                                </label>
                                <input type="number" id="anio" class="form-control" min="1888" max="2100" required>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                Crear película
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h4>
                            Crear actor
                        </h4>
                        <form id="formActor">
                            <div class="mb-3">
                                <label for="nombreActor" class="form-label">
                                    Nombre
                                </label>
                                <input type="text" id="nombreActor" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="fechaNacimiento" class="form-label">
                                    Fecha de nacimiento
                                </label>
                                <input type="date" id="fechaNacimiento" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-success">
                                Crear actor
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h4>
                    Asignar actor a película
                </h4>
                <form id="formAsignar" class="row g-3">
                    <div class="col-md-5">
                        <label for="peliculaSelect" class="form-label">
                            Película
                        </label>
                        <select id="peliculaSelect" class="form-select" required>
                            <option value="">
                                Seleccione una película
                            </option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label for="actorSelect" class="form-label">
                            Actor
                        </label>
                        <select id="actorSelect" class="form-select" required>
                            <option value="">
                                Seleccione un actor
                            </option>
                        </select>
                    </div>
                    <divclass="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-warning w-100">
                            Asignar
                        </button>
            </div>
            </form>
        </div>
        </div>
        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="mb-0">
                                Películas
                            </h4>
                            <button id="btnPeliculas" class="btn btn-outline-primary btn-sm">
                                Actualizar
                            </button>
                        </div>
                        <div id="listaPeliculas">
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="mb-0">
                                Actores
                            </h4>
                            <button id="btnActores" class="btn btn-outline-success btn-sm">
                                Actualizar
                            </button>
                        </div>
                        <div id="listaActores">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">
            Sitio desarrollado por <kbd class="bg-primary">CHOCOLAT</kbd>
        </p>
    </footer>
    <script>

        const mensaje =
            document.getElementById("mensaje");

        const formPelicula = document.getElementById("formPelicula");

        const formActor = document.getElementById("formActor");

        const formAsignar = document.getElementById("formAsignar");

        const peliculaSelect = document.getElementById("peliculaSelect");

        const actorSelect = document.getElementById("actorSelect");

        const listaPeliculas = document.getElementById("listaPeliculas");

        const listaActores = document.getElementById("listaActores");

        function mostrarMensaje(
            texto,
            tipo = "success"
        ) {
            mensaje.innerHTML = `
                <divclass="alert alert-${tipo} alert-dismissible fade show">
                    ${texto}
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                    ></button>
                </div>
            `;
        }

        async function cargarPeliculas() {
            try {
                const respuesta = await fetch("/peliculas");
                const peliculas = await respuesta.json();

                listaPeliculas.innerHTML = "";
                peliculaSelect.innerHTML = `
                    <option value="">
                        Seleccione una película
                    </option>
                `;

                if (!Array.isArray(peliculas) || peliculas.length === 0) {
                    listaPeliculas.innerHTML = `
                        <p class="text-secondary">
                            No existen películas registradas.
                        </p>
                    `;
                    return;
                }

                peliculas.forEach(pelicula => {
                    peliculaSelect.innerHTML += `
                            <option value="${pelicula.id}" >
                                ${pelicula.titulo}
                                (${pelicula.anio})
                            </option>
                        `;
                    const actores = pelicula.Actors && pelicula.Actors.length > 0 ?
                        pelicula.Actors.map(actor => actor.nombre).join(", ")
                        : "Sin actores asignados";
                    listaPeliculas.innerHTML += `
                            <div class="border rounded p-3 mb-2">
                                <strong>
                                    ${pelicula.titulo}
                                </strong>
                                <span class="text-secondary">
                                    (${pelicula.anio})
                                </span>
                                <br>
                                <small>
                                    Actores:
                                    ${actores}
                                </small>
                            </div>
                        `;
                }
                );
            } catch (error) {
                console.error(error);
                mostrarMensaje(
                    "Error al obtener películas.",
                    "danger"
                );
            }
        }

        async function cargarActores() {
            try {
                const respuesta = await fetch("/actores");
                const actores = await respuesta.json();

                listaActores.innerHTML = "";
                actorSelect.innerHTML = `
                    <option value="">
                        Seleccione un actor
                    </option>
                `;

                if (!Array.isArray(actores) || actores.length === 0) {
                    listaActores.innerHTML = `
                        <p class="text-secondary">
                            No existen actores registrados.
                        </p>
                    `;
                    return;
                }

                actores.forEach(actor => {
                    actorSelect.innerHTML += `
                            <option
                                value="${actor.id}"
                            >
                                ${actor.nombre}
                            </option>

                        `;

                    const peliculas = actor.Peliculas && actor.Peliculas.length > 0
                        ? actor.Peliculas.map(pelicula => pelicula.titulo).join(", ")
                        : "Sin películas asignadas";
                    listaActores.innerHTML += `
                            <div class="border rounded p-3 mb-2">
                                <strong>
                                    ${actor.nombre}
                                </strong>
                                <br>
                                <small>
                                    Nacimiento:
                                    ${actor.fecha_nacimiento}
                                </small>
                                <br>
                                <small>
                                    Películas:
                                    ${peliculas}
                                </small>
                            </div>
                        `;
                }
                );
            } catch (error) {
                console.error(error);
                mostrarMensaje(
                    "Error al obtener actores.",
                    "danger"
                );
            }
        }

        formPelicula.addEventListener("submit", async (evento) => {
            evento.preventDefault();
            const titulo = document.getElementById("titulo").value.trim();
            const anio = Number(document.getElementById("anio").value);

            try {
                const respuesta = await fetch("/peliculas", {
                    method:
                        "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            titulo,
                            anio
                        })
                }
                );
                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    mostrarMensaje(
                        datos.mensaje,
                        "danger"
                    );
                    return;
                }
                mostrarMensaje(
                    datos.mensaje,
                    "success"
                );
                formPelicula.reset();
                await cargarPeliculas();
            } catch (error) {
                console.error(error);
                mostrarMensaje(
                    "Error al crear la película.",
                    "danger"
                );
            }
        }
        );

        formActor.addEventListener("submit", async (evento) => {
            evento.preventDefault();
            const nombre = document.getElementById("nombreActor").value.trim();
            const fechaNacimiento = document.getElementById("fechaNacimiento").value;
            try {
                const respuesta = await fetch("/actores", {
                    method:
                        "POST",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify({
                            nombre,
                            fecha_nacimiento:
                                fechaNacimiento
                        })
                }
                );

                const datos = await respuesta.json();
                if (!respuesta.ok) {
                    mostrarMensaje(
                        datos.mensaje,
                        "danger"
                    );
                    return;
                }
                mostrarMensaje(
                    datos.mensaje,
                    "success"
                );

                formActor.reset();
                await cargarActores();

            } catch (error) {
                console.error(error);
                mostrarMensaje(
                    "Error al crear el actor.",
                    "danger"
                );
            }
        }
        );

        formAsignar.addEventListener("submit", async (evento) => {
            evento.preventDefault();

            const peliculaId = Number(peliculaSelect.value);
            const actorId = Number(actorSelect.value);

            try {
                const respuesta = await fetch("/asignar-actor", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        pelicula_id: peliculaId,
                        actor_id: actorId
                    })
                });

                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    mostrarMensaje(datos.mensaje, "danger");
                    return;
                }

                mostrarMensaje(
                    `${datos.mensaje}: ${datos.actor.nombre} → ${datos.pelicula.titulo}`,
                    "success"
                );

                formAsignar.reset();

                await Promise.all([
                    cargarPeliculas(),
                    cargarActores()
                ]);

            } catch (error) {
                console.error(error);
                mostrarMensaje(
                    "Error al asignar el actor.",
                    "danger"
                );
            }
        });
        
        document.getElementById("btnPeliculas")
            .addEventListener("click", cargarPeliculas);


        document.getElementById("btnActores")
            .addEventListener("click", cargarActores);

        Promise.all([
            cargarPeliculas(),
            cargarActores()
        ]);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
